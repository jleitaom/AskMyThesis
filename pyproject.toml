[project]
name = "askmythesis"
version = "0.1.0"
description = "Bilingual (PT/EN) RAG assistant that answers questions grounded in a thesis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-chroma==1.1.0",
    "langchain-community==0.4.1",
    "langchain-core==1.4.8",
    "langchain-huggingface==1.2.2",
    "langchain-ollama==1.1.0",
    "langchain-text-splitters==1.1.2",
    "langdetect==1.0.9",
    "pdfplumber==0.11.10",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "ragas==0.4.3",
    "sentence-transformers==6.1.0",
    "streamlit==1.59.0",
    "transformers==5.12.1",
]

[dependency-groups]
notebooks = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
    "nltk>=3.10.3",
    "pandas>=2.3.3",
]

[tool.uv]
package = false
